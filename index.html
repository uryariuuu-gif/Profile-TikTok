<script>
var $=function(i){return document.getElementById(i)},P=$('phone');
$('bigimg').src=$('avimg').src;
function fit(){var w=window.innerWidth,h=window.innerHeight,p=Math.min(w/1080,h/2000);
 P.style.width=(1080*p)+'px';$('stage').style.transform='scale('+p+')';$('stage').style.height=(h/p)+'px'}
fit();window.addEventListener('resize',fit);
var v1=$('bgv1'),v2=$('bgv2');v2.src=v1.src;
function setBg(){var on=P.classList.toggle('hasbg');[v1,v2].forEach(function(v){if(on){var r=v.play();if(r&&r.catch)r.catch(function(){})}else v.pause()})}
function vStart(){var s=140/1080,bt=($('stage').offsetHeight-1440)/2,b=$('vbox');b.style.transform='translate(294px,'+(708-180*s-bt)+'px) scale('+s+')';b.style.clipPath='inset(180px 0px 180px 0px round 494px)'}

function closeV(){P.classList.remove('vopen');vStart();setTimeout(function(){P.classList.remove('viewing')},400)}
var DEF=v1.src,posts=[],banner=null;
function idb(){return new Promise(function(res){try{var r=indexedDB.open('tt',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function kvGet(k){return idb().then(function(d){return d?new Promise(function(res){try{var q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res()}}catch(e){res()}}):undefined})}
function kvSet(k,v){return idb().then(function(d){if(d)try{d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}})}
function ty(f){return f.type.indexOf('video')==0?'video':'image'}
var A=1080/450,cp=null,cEl=null,cg=null;
function nat(n){return [n.naturalWidth||n.videoWidth,n.naturalHeight||n.videoHeight]}
function defPos(n){var d=nat(n),nw=d[0],nh=d[1];if(!nw)return null;if(nw/nh>=A){var w=A*nh/nw;return {x:(1-w)/2,y:0,w:w}}return {x:0,y:0,w:1}}
function lay(n,p){var d=nat(n),nw=d[0],nh=d[1];if(!nw||p.w==null)return;var s=1080/(p.w*nw);n.style.width=(nw*s)+'px';n.style.height=(nh*s)+'px';n.style.left=(-p.x*nw*s)+'px';n.style.top=(-p.y*nh*s)+'px'}
function layoutAll(){if(!banner)return;if(!banner.pos||banner.pos.w==null){var n=document.querySelector('.bw .bgv'),d=n&&defPos(n);if(!d)return;banner.pos=d;saveBanner()}document.querySelectorAll('.bw .bgv').forEach(function(m){lay(m,banner.pos)})}
function mk(type,url,onld){var n=document.createElement(type=='video'?'video':'img');n.className='bgv';n.src=url;if(type=='video'){n.muted=true;n.loop=true;n.autoplay=true;n.setAttribute('playsinline','');n.onloadedmetadata=onld}else n.onload=onld;return n}
function showBanner(type,url){['prof','edit'].forEach(function(id){var s=$(id),old=s.querySelector('.bw')||s.querySelector('.bgv'),w=document.createElement('div');w.className='bw';var n=mk(type,url,layoutAll);w.appendChild(n);old.parentNode.replaceChild(w,old);if(type=='video'){var r=n.play();if(r&&r.catch)r.catch(function(){})}});P.classList.add('hasbg')}
function saveBanner(){if(banner)kvSet('banner',banner.def?{type:'video',def:1,v2:1,pos:banner.pos}:{type:banner.type,blob:banner.blob,v2:1,pos:banner.pos})}
function useBanner(it){banner={type:it.type,def:it.def,blob:it.blob,pos:null};showBanner(it.type,it.def?DEF:URL.createObjectURL(it.blob));pendBg=true;P.classList.remove('hasbg');crop(true)}
var pendBg=false;function revealBg(){if(!pendBg)return;pendBg=false;P.classList.add('hasbg');layoutAll()}
function clearBanner(){pendBg=false;P.classList.remove('hasbg');banner=null;kvSet('banner',null)}
function crop(isNew){if(!banner)return;cp=banner.pos&&banner.pos.w!=null?Object.assign({},banner.pos):{x:0,y:0,w:null};var w=$('cw');w.innerHTML='';cEl=mk(banner.type,banner.def?DEF:URL.createObjectURL(banner.blob),cropInit);w.appendChild(cEl);$('cl').textContent=isNew?'Skip':'Cancel';P.classList.add('cropping')}
function cropInit(){var d=nat(cEl),nw=d[0],nh=d[1];if(!nw)return;var ds=Math.min(1080/nw,1400/nh),dw=nw*ds,dh=nh*ds;cg={dw:dw,dh:dh,ox:(1080-dw)/2,oy:(1400-dh)/2,hr:nw/(A*nh)};if(cp.w==null)cp=defPos(cEl);cEl.style.width=dw+'px';cEl.style.height=dh+'px';cEl.style.left=cg.ox+'px';cEl.style.top=cg.oy+'px';var r=$('cw').querySelector('.crb');if(!r){r=document.createElement('div');r.className='crb';['tl','tr','bl','br'].forEach(function(c){var h=document.createElement('i');h.className='hd '+c;h.dataset.c=c;r.appendChild(h)});$('cw').appendChild(r)}rp()}
function rp(){var r=$('cw').querySelector('.crb');if(!r||!cg)return;r.style.left=(cg.ox+cp.x*cg.dw)+'px';r.style.top=(cg.oy+cp.y*cg.dh)+'px';r.style.width=(cp.w*cg.dw)+'px';r.style.height=(cp.w*cg.hr*cg.dh)+'px'}
function cropClose(){P.classList.remove('cropping');revealBg()}
function importing(){var m=$('imp');m.classList.add('on');P.classList.remove('cropping');layoutAll();setTimeout(function(){m.classList.remove('on');setTimeout(revealBg,150)},1400)}
function cropSkip(){if($('cl').textContent=='Skip')importing();else cropClose()}
function cropDone(){if(banner&&cp&&cp.w!=null){banner.pos={x:cp.x,y:cp.y,w:cp.w};saveBanner()}importing()}
(function(){var w=$('cw'),d=null;
 function pt(e){var b=w.getBoundingClientRect(),k=1080/$('stage').getBoundingClientRect().width;return {x:((e.clientX-b.left)*k-cg.ox)/cg.dw,y:((e.clientY-b.top)*k-cg.oy)/cg.dh}}
 w.addEventListener('pointerdown',function(e){if(!cg)return;var c=e.target.dataset&&e.target.dataset.c;if(!c&&!(e.target.classList&&e.target.classList.contains('crb')))return;d={c:c,p:pt(e),s:Object.assign({},cp)};try{w.setPointerCapture(e.pointerId)}catch(x){}});
 w.addEventListener('pointermove',function(e){if(!d)return;var p=pt(e),s=d.s,hr=cg.hr,hf=s.w*hr;
  if(!d.c){cp.x=Math.max(0,Math.min(1-s.w,s.x+p.x-d.p.x));cp.y=Math.max(0,Math.min(1-hf,s.y+p.y-d.p.y))}
  else{var l=d.c[1]=='l',tp=d.c[0]=='t',fx=l?s.x+s.w:s.x,fy=tp?s.y+hf:s.y,rx=l?fx:1-fx,ry=tp?fy:1-fy,wn=Math.max(Math.abs(p.x-fx),Math.abs(p.y-fy)/hr);wn=Math.max(.08,Math.min(wn,rx,ry/hr));cp.w=wn;cp.x=l?fx-wn:fx;cp.y=tp?fy-wn*hr:fy}
  rp()});
 function up(){d=null}w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up)})();

function media(it){var m=document.createElement(it.type=='video'?'video':'img');m.src=it.def?DEF:URL.createObjectURL(it.blob);if(it.type=='video'){m.muted=true;m.preload='metadata';m.setAttribute('playsinline','')}return m}
function renderGrid(){var g=$('grid');g.innerHTML='';posts.forEach(function(it){var c=document.createElement('div');c.className='cell';c.appendChild(media(it));g.appendChild(c)});g.classList.toggle('on',posts.length>0);$('prof').querySelector('.empty').style.display=posts.length?'none':''}
function openSheet(){var h='<div class="stt">Profile background</div>'+'<button class="opt" onclick="shut();$(\'fb\').click()">Upload photo</button><button class="opt" onclick="shut();openPick()">Choose from your posts</button>';
 if(P.classList.contains('hasbg'))h+='<button class="opt" onclick="shut();crop(false)">Adjust position</button><button class="opt rm" onclick="shut();clearBanner()">Remove background</button>';
 h+='<div class="gap"></div><button class="opt" onclick="shut()">Cancel</button>';$('panel').innerHTML=h;$('sheet').classList.add('on');void $('panel').offsetWidth;$('panel').classList.add('open')}
function shut(){$('panel').classList.remove('open');setTimeout(function(){$('sheet').classList.remove('on')},300)}
function openPick(){var g=$('pgrid');g.innerHTML='';[{type:'video',def:1}].concat(posts).forEach(function(it){var b=document.createElement('button');b.className='cell';b.appendChild(media(it));b.onclick=function(){useBanner(it);closePick()};g.appendChild(b)});P.classList.add('picking')}
function closePick(){P.classList.remove('picking')}
$('fb').onchange=function(){var f=this.files[0];if(f)useBanner({type:ty(f),blob:f});this.value=''};

function refresh(){var s=$('stage'),d=$('dots');s.style.setProperty('--pl','210px');d.style.opacity=1;setTimeout(function(){kvGet('posts').then(function(p){if(p){posts=p;renderGrid()}});var v=$('prof').querySelector('video.bgv');if(v){v.currentTime=0;var r=v.play();if(r&&r.catch)r.catch(function(){})}s.style.setProperty('--pl','0px');d.style.opacity=0},650)}
(function(){var st=$('stage'),y0=null,pl=0,d=$('dots');
 function k(){return 1080/st.getBoundingClientRect().width}
 $('prof').addEventListener('pointerdown',function(e){if(P.classList.contains('editing')||e.target.closest('#grid'))return;y0=e.clientY});
 window.addEventListener('pointermove',function(e){if(y0==null)return;var m=(e.clientY-y0)*k();if(m<=0)return;pl=Math.min(m*.55,300);P.classList.add('pulling');st.style.setProperty('--pl',pl+'px');d.style.opacity=Math.min(1,pl/120)});
 function up(){if(y0==null)return;y0=null;P.classList.remove('pulling');if(pl>200)refresh();else{st.style.setProperty('--pl','0px');d.style.opacity=0}pl=0}
 window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)})();
kvGet('posts').then(function(p){if(p){posts=p;renderGrid()}});
kvGet('banner').then(function(b){if(b){banner=b;b.pos=b.v2?b.pos:null;if(b.def)showBanner('video',DEF);else if(b.blob)showBanner(b.type,URL.createObjectURL(b.blob))}});
function openEdit(){P.classList.add('editing')}

 var n=$('iname').value.trim()||'Kai Reed',u=($('iuser').value.trim()||'kai.reed9').replace(/\s+/g,'');

}

$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;

</script>
